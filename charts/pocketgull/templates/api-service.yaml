apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app: api
    {{- include "pocketgull.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
  selector:
    app: api
