# Default values for pocketgull Helm chart.

global:
  environment: production
  project: "gen-lang-client-0540208645"
  version: "1.42.0"

web:
  replicaCount: 0
  keda:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 10
  image:
    repository: us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull
    tag: "1.42.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 4000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

api:
  replicaCount: 0
  keda:
    enabled: true
    minReplicaCount: 0
    maxReplicaCount: 10
  image:
    repository: us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull-api
    tag: "1.42.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8001
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4096Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

hueRelay:
  enabled: false
  replicaCount: 0
  image:
    repository: us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull-hue-relay
    tag: "1.42.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8088
    targetPort: 8088

agonesFleet:
  enabled: true
  replicas: 0
  image:
    repository: us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull
    tag: "1.42.0"
  autoscaler:
    enabled: true
    bufferSize: 0
    minReplicas: 0
    maxReplicas: 20

otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.120.0"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

config:
  frontendOrigin: "https://pocketgull.app"
  pythonApiUrl: "http://api-service:8080"
  otelServiceName: "pocketgull"
  otelTracesSampler: "parentbased_traceidratio"
  otelTracesSamplerArg: "0.1"
  otelSdkDisabled: "false"
  otelExporterOtlpEndpoint: "http://otel-collector:4318"
