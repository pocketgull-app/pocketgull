# Default values for pocketgull Helm chart.

global:
  environment: production
  project: "gen-lang-client-0540208645"

web:
  replicaCount: 1
  image:
    repository: us-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull-web
    tag: "1.31.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 4000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

api:
  replicaCount: 1
  image:
    repository: us-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull-api
    tag: "1.31.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8001
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4096Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

hueRelay:
  enabled: true
  replicaCount: 1
  image:
    repository: us-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull-hue-relay
    tag: "1.31.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8088
    targetPort: 8088

agonesFleet:
  enabled: true
  replicas: 0
  image:
    repository: us-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull
    tag: "1.31.0"
  autoscaler:
    enabled: true
    bufferSize: 2
    minReplicas: 0
    maxReplicas: 20

otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.120.0"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

config:
  frontendOrigin: "https://pocketgull.app"
  pythonApiUrl: "http://api-service:8080"
  otelServiceName: "pocketgull"
  otelTracesSampler: "parentbased_always_on"
  otelSdkDisabled: "false"
  otelExporterOtlpEndpoint: "http://otel-collector:4318"
