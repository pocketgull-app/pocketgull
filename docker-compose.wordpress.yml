version: '3.8'

services:
  wordpress_db:
    image: mariadb:10.11
    container_name: pocketgull_wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pocketgull_wp
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wp_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wp_root_password}
    volumes:
      - wp_db_data:/var/lib/mysql
    networks:
      - pocketgull_wp_net

  wordpress_app:
    image: wordpress:6.5-php8.2-apache
    container_name: pocketgull_wp_app
    restart: unless-stopped
    depends_on:
      - wordpress_db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: wordpress_db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wp_dev_password}
      WORDPRESS_DB_NAME: pocketgull_wp
      WORDPRESS_DEBUG: 1
    volumes:
      - ./wordpress-theme/pocketgull-articles:/var/www/html/wp-content/themes/pocketgull-articles:ro
      - wp_uploads_data:/var/www/html/wp-content/uploads
    networks:
      - pocketgull_wp_net

  wp_cli:
    image: wordpress:cli-2.10-php8.2
    container_name: pocketgull_wp_cli
    user: "33:33"
    depends_on:
      - wordpress_app
      - wordpress_db
    environment:
      WORDPRESS_DB_HOST: wordpress_db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wp_dev_password}
      WORDPRESS_DB_NAME: pocketgull_wp
    volumes:
      - ./wordpress-theme/pocketgull-articles:/var/www/html/wp-content/themes/pocketgull-articles:ro
      - ./scripts:/scripts:ro
    networks:
      - pocketgull_wp_net

volumes:
  wp_db_data:
  wp_uploads_data:

networks:
  pocketgull_wp_net:
    driver: bridge
