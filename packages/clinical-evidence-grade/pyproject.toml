[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_grader"]

[project]
name = "clinical-evidence-grade"
version = "1.0.0"
description = "Oxford CEBM Levels, Cochrane Risk of Bias 2 (RoB 2), GRADE Evidence Grading, and Popperian Null-Hypothesis Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pocket-Gull Engineering", email = "engineering@pocketgull.app" },
    { name = "Phil Gear", email = "leads@pocketgull.app" }
]
keywords = [
    "evidence-based-medicine",
    "cochrane-rob2",
    "ocebm",
    "grade-framework",
    "clinical-decision-support",
    "popperian-falsifiability",
    "biostatistics"
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
