name: "Pocket Gull CodeQL Filtering"

# Exclude non-production test fixtures and research workspaces from security scanning
# Note: scripts/** and public/** are intentionally scanned by CodeQL.
paths-ignore:
  - '**/*.spec.ts'
  - 'tests/**'
  - 'e2e/**'
  - 'docs/**'
  - 'companion-apps/**'
  - 'contests/**'
  - 'sandbox/**'
  - 'run-playwright.cjs'
  - 'vitest.config.ts'
  - 'playwright.config.ts'
