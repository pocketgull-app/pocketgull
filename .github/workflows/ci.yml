name: "CI/CD Pipeline (HIPAA Compliant)"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'documentation/**'
      - '.gitignore'
      - 'LICENSE'
      - 'typefaces_vault/**'
      - 'public/**'
      - 'scripts/**'
      - 'dist/**'
      - 'brand/**'
      - 'tools/**'
      - 'data/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'documentation/**'
      - '.gitignore'
      - 'LICENSE'
      - 'typefaces_vault/**'
      - 'public/**'
      - 'scripts/**'
      - 'dist/**'
      - 'brand/**'
      - 'tools/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-lint:
    name: security-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: false
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Lint (tsc --noEmit)
        run: npm run lint

      - name: Sentinel Security & Log Injection Audit
        run: npm run sentinel:audit

      - name: MSA & AI Services Governance Audit
        run: npm run msa:audit

      - name: Porter's Five Forces Strategic & Deployment Audit
        run: npm run porter:audit

      - name: Generate CycloneDX SBOM (EU CRA Compliance)
        run: npm run sbom

      - name: Validate Cloud Run Enclave & gVisor Policy-as-Code
        run: |
          echo "Verifying Cloud Run gVisor and scale-to-zero configurations..."
          test -f gcp/cloudrun-service-enclave.json || (echo "Missing Cloud Run Enclave Spec" && exit 1)
          grep -q 'gvisor' gcp/cloudrun-service-enclave.json || (echo "gVisor sandbox annotation missing" && exit 1)
          grep -q 'minScale.*0' gcp/cloudrun-service-enclave.json || (echo "Scale-to-zero policy missing" && exit 1)
          echo "Policy-as-Code checks passed successfully."

      - name: Run Tests (Vitest)
        run: npx vitest run

  python-ml-test:
    name: Python ML & Sidecar
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: false
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pocketgull_api/requirements.txt'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libhdf5-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pocketgull_api/requirements.txt
          python -m pip check

      - name: Run Python Tests
        env:
          PYTHONPATH: pocketgull_api:.
        run: |
          python3 pocketgull_api/train_clinical_risk_models.py || true
          python3 pocketgull_api/train_seven_generations_model.py || true
          python3 pocketgull_api/run_tests.py

  test-e2e:
    name: test-e2e
    needs: [security-and-lint]
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: false
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Application
        run: npm run build
        env:
          CI: true
          NODE_ENV: 'production'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          VITE_PUBLIC_API_URL: 'http://127.0.0.1:4000'
          SKIP_HEALTHCARE_PROVISION: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Start Preview Server
        run: |
          npm run preview > /tmp/server.log 2>&1 &
          echo $! > .server.pid
        env:
          PORT: '4000'
          CI: true
          NODE_ENV: 'production'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: Wait for Preview Server
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:4000/health > /dev/null 2>&1; then
              echo "Preview server is ready on http://127.0.0.1:4000 (attempt $i)"
              exit 0
            fi
            echo "Waiting for preview server (attempt $i/30)..."
            sleep 2
          done
          echo "Preview server failed to start within 60s. Server logs:"
          cat /tmp/server.log || true
          exit 1

      - name: "Run E2E Tests (PR Fast Tier: Desktop Chrome)"
        if: github.event_name == 'pull_request'
        run: npm run test:e2e -- --project=desktop-chrome
        env:
          CI: true
          PORT: '4000'
          BASE_URL: 'http://127.0.0.1:4000'
          PLAYWRIGHT_WORKERS: '4'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: "Run E2E Tests (Main CI Tier: Core Desktop + Mobile)"
        if: github.event_name != 'pull_request'
        run: npm run test:e2e -- --project=desktop-chrome --project=mobile-iphone
        env:
          CI: true
          PORT: '4000'
          BASE_URL: 'http://127.0.0.1:4000'
          PLAYWRIGHT_WORKERS: '4'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: Stop Preview Server
        if: always()
        run: |
          if [ -f .server.pid ]; then
            kill $(cat .server.pid) || true
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
