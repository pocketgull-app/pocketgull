name: "Fuzz Testing"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Python Fuzz Tests (Atheris)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: false
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libhdf5-dev
          python -m pip install --upgrade pip
          pip install -r pocketgull_api/requirements.txt
          pip install atheris

      - name: Run Fuzz Targets
        run: |
          cd pocketgull_api
          python fuzz_targets.py
        env:
          # Atheris CI mode: run each target for a fixed number of iterations
          FUZZING_CI: "true"
        timeout-minutes: 10
