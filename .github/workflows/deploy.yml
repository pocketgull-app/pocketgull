# Deployment Pipeline (Cloud Run) - Automated Production & Staging Deployment
name: Deployment Pipeline (Cloud Run)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'documentation/**'
      - '.gitignore'
      - 'LICENSE'
      - 'typefaces_vault/**'
      - 'brand/**'
      - 'scratch/**'
      - '.agents/**'
      - 'packages/pocketgull-theme/**'
      - 'contests/**'
      - 'datasets/**'
      - 'arxiv/**'
      - 'companion-apps/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: false
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Setup Dart SDK (TIPPSS & PHI Taint Pre-Flight)
        uses: dart-lang/setup-dart@e630b99d28a3b71860378cafdc2a067c71107f94 # v1.7.0
        with:
          sdk: stable

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Security Audit (High/Critical Fail-Closed)
        run: npm audit --audit-level=high --json > audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-report
          path: audit.json

      # Mandatory 8-Gate Pre-Flight (Gates 1-7; Gate 8 gcp:audit runs with WIF in build-and-deploy)
      - name: Gate 1 — TypeScript Strict Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Gate 2 — Unit & Clinical Safety Tests (Vitest)
        run: npx vitest run

      - name: Gate 3 — Sentinel Security & Log Injection Guard
        run: npm run sentinel:audit

      - name: Gate 4 — CycloneDX 1.6 SBOM Generation
        run: npm run sbom

      - name: Gate 5 — Mozilla HTTP Observatory 125+ Header Audit
        run: npm run observatory:audit

      - name: Gate 6 — IEEE P2933 TIPPSS Schema Parity Audit
        run: npm run tippss:audit

      - name: Gate 7 — PHI Taint Boundary & Static Taint Audit
        run: |
          npm run taint:audit
          npm run taint:scan

      - name: Gate 7b — Master Epistemic Ground-Truth & Porter Deployment Audit
        run: |
          npm run audit:epistemic
          npm run porter:audit

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pocketgull_api/requirements.txt'

      - name: Install Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libhdf5-dev
          python -m pip install --upgrade pip
          pip install -r pocketgull_api/requirements.txt

      - name: Run Python Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r pocketgull_api/requirements.txt --local

  test-e2e:
    needs: security-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: false
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Rebuild Native Binaries
        run: npm rebuild esbuild --update-binary || true

      - name: Build Application
        run: npm run build
        env:
          CI: true
          NODE_ENV: 'production'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          VITE_PUBLIC_API_URL: 'http://127.0.0.1:4000'
          SKIP_HEALTHCARE_PROVISION: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Start Preview Server
        run: |
          npm run preview > /tmp/server.log 2>&1 &
          echo $! > .server.pid
        env:
          PORT: '4000'
          CI: true
          NODE_ENV: 'production'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: Wait for Preview Server
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:4000/health > /dev/null 2>&1; then
              echo "Preview server is ready on http://127.0.0.1:4000 (attempt $i)"
              exit 0
            fi
            echo "Waiting for preview server (attempt $i/30)..."
            sleep 2
          done
          echo "Preview server failed to start within 60s. Server logs:"
          cat /tmp/server.log || true
          exit 1

      - name: Run E2E Tests (All 6 Institutional Thin-Client Viewports — Real CSP)
        run: >
          npm run test:e2e --
          --project=desktop-chrome
          --project=mobile-chrome
          --project=mobile-iphone
          --project=tablet-ipad-exam-room
          --project=chromebook-school-library
          --project=clinical-cow-workstation
        env:
          CI: true
          PORT: '4000'
          BASE_URL: 'http://127.0.0.1:4000'
          PLAYWRIGHT_WORKERS: '4'
          PLAYWRIGHT_TESTING: 'true'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: Stop Preview Server
        if: always()
        run: |
          if [ -f .server.pid ]; then
            kill $(cat .server.pid) || true
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Deploy a tagged Cloud Run revision for PR preview/staging
  preview-deploy:
    needs: [security-and-lint, test-e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: false
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies & Build Production Dist
        run: |
          npm ci --legacy-peer-deps
          npm run build
        env:
          CI: true
          NODE_ENV: 'production'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Build Preview Image
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          IMAGE_PATH=us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull
          docker build -t $IMAGE_PATH:pr-${{ github.event.number }} .

      - name: Push Preview Image
        run: |
          IMAGE_PATH=us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull
          docker push $IMAGE_PATH:pr-${{ github.event.number }}

      - name: Deploy Preview to Cloud Run
        id: deploy-preview
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v2.3.0
        with:
          service: 'pocket-gull'
          region: 'us-central1'
          image: 'us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull:pr-${{ github.event.number }}'
          tag: 'pr-${{ github.event.number }}'
          no_traffic: true  # Don't shift production traffic
          env_vars: |
            NODE_ENV=production
            OTEL_SDK_DISABLED=true
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_REGION=us-central1
          flags: '--service-account=pocketgull-run@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com --binary-authorization=default --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest --concurrency=100 --max-instances=1 --min-instances=0'

      - name: Comment Preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = '${{ steps.deploy-preview.outputs.url }}';
            const body = `🔍 **Preview deployed!**\n\n🌐 ${url}\n\n_This preview will be cleaned up when the PR is closed._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('Preview deployed!'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  build-and-deploy:
    needs: [security-and-lint, test-e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production # Enables manual approval gates in GitHub
    
    # Required permissions for Workload Identity Federation and SLSA Attestation
    permissions:
      contents: 'read'
      id-token: 'write'
      attestations: 'write'
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: false
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # Keyless Workload Identity Federation
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Dart SDK (Pre-Flight Parity Gates)
        uses: dart-lang/setup-dart@e630b99d28a3b71860378cafdc2a067c71107f94 # v1.7.0
        with:
          sdk: stable

      - name: Install Dependencies & Run 8-Gate Pre-Flight + Production Build
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npx vitest run
          npm run sentinel:audit
          npm run sbom
          npm run observatory:audit
          npm run tippss:audit
          npm run taint:audit
          npm run audit:epistemic
          npm run porter:audit
          npm run gcp:audit
          npm run build
        env:
          CI: true
          NODE_ENV: 'production'
          GEMINI_API_KEY: 'placeholder-key-for-build'
          SKIP_HEALTHCARE_PROVISION: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'
          GOOGLE_CLOUD_PROJECT: 'gen-lang-client-0540208645'

      - name: Build Docker Image
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          IMAGE_PATH=us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull

          # Docker caching for faster builds
          docker pull $IMAGE_PATH:latest || true
          docker build \
            --cache-from $IMAGE_PATH:latest \
            -t $IMAGE_PATH:${{ github.sha }} \
            -t $IMAGE_PATH:latest .

      - name: Push Docker Image
        id: push-image
        run: |
          IMAGE_PATH=us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull
          docker push $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:latest

          # Extract immutable image digest (OpenSSF / SLSA Standard)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_PATH:${{ github.sha }}" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "image_target=$IMAGE_PATH@$DIGEST" >> $GITHUB_OUTPUT
          echo "Resolved immutable container digest: $DIGEST"

      # --- OpenSSF SLSA Provenance Attestation ---
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: "us-central1-docker.pkg.dev/gen-lang-client-0540208645/cloud-run-source-deploy/pocketgull"
          subject-digest: "${{ steps.push-image.outputs.digest }}"
          push-to-registry: false
          
      - name: Deploy to Cloud Run (Immutable Digest)
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v2.3.0
        with:
          service: 'pocket-gull'
          region: 'us-central1'
          image: '${{ steps.push-image.outputs.image_target }}'
          env_vars: |
            NODE_ENV=production
            OTEL_SDK_DISABLED=true
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_REGION=us-central1
          # Secure deployment flags + secrets binding + Binary Authorization
          flags: '--service-account=pocketgull-run@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com --binary-authorization=default --concurrency=100 --max-instances=10 --min-instances=0 --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
