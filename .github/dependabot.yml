version: 2
updates:
  # NPM — Root Angular/Express app (Monthly security & patch aggregation, zero breaking major upgrades)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      production-patches:
        dependency-type: "production"
        patterns:
          - "*"
      dev-patches:
        dependency-type: "development"
        patterns:
          - "*"

  # GitHub Actions — Security SHA pinning updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # Docker — Base image security updates (Node 24 LTS pinned, ignore non-LTS Node 25)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "node"
        versions: ["25*"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(docker)"

  # Pip — Python FastAPI sidecar
  - package-ecosystem: "pip"
    directory: "/pocketgull_api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(py-deps)"
    groups:
      python-packages:
        patterns:
          - "*"

  # Go — High-performance sidecar
  - package-ecosystem: "gomod"
    directory: "/packages/pocketgull-go"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(go-deps)"
    groups:
      go-packages:
        patterns:
          - "*"
