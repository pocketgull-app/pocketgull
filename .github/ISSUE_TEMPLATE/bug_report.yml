name: Clinical Bug Report
description: Report a bug, crash, or unexpected behavior in Pocket Gull.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to Pocket Gull! Please fill out the form below to help us reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: dropdown
    id: component-area
    attributes:
      label: Component / Area Impacted
      description: Select the primary system layer affected.
      options:
        - 3D Anatomical Viewer (Three.js)
        - Bi-Directional Voice Assistant (AVS / Web Speech)
        - Care Plan & PDF Export Engine
        - Patient State & Signals Store
        - Gesture Unlock / Wacom Canvas
        - Express Backend / GCP Cloud Run Proxy
        - Other / General UI
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Open '...'
        2. Click on '...'
        3. Double-click on '...'
        4. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: Browser version, OS, or hardware (e.g. Chrome 124, Windows 11, Wacom Intuos).
      placeholder: e.g. Chrome v124, Apple Silicon M2, Wacom Intuos Pro
    validations:
      required: false
