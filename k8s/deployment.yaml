apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketgull-app
  namespace: pocketgull-production
  labels:
    app.kubernetes.io/name: pocketgull-app
    app.kubernetes.io/component: ssr-and-api-server
    app.kubernetes.io/version: "1.22.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pocketgull-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocketgull-app
        app.kubernetes.io/version: "1.22.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/health"
    spec:
      serviceAccountName: pocketgull-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pocketgull-server
          image: gcr.io/gen-lang-client-0540208645/pocketgull:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: GOOGLE_CLOUD_PROJECT
              value: "gen-lang-client-0540208645"
            - name: POCKETGULL_LIVE_DEMO
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/discovery/tools
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: tmp-storage
              mountPath: /tmp
      volumes:
        - name: tmp-storage
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
