apiVersion: "autoscaling.agones.dev/v1"
kind: FleetAutoscaler
metadata:
  name: pocketgull-consult-autoscaler
  namespace: default
spec:
  fleetName: pocketgull-consult-fleet
  policy:
    type: Buffer
    buffer:
      bufferSize: 2 # keep 2 Ready pods in reserve when active
      minReplicas: 0 # scales to 0 when idle to eliminate baseline compute charges
      maxReplicas: 20
