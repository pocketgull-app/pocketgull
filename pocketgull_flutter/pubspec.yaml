name: pocketgull_flutter
description: "A new Flutter project."
publish_to: 'none'
resolution: workspace

version: 1.4.0+14

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  equatable: ^2.0.8
  socket_io_client: ^3.1.6
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  flutter_3d_controller: ^2.3.0
  pdf: ^3.13.1
  printing: ^5.15.1
  webview_flutter: ^4.13.1
  shared_preferences: ^2.5.6
  crypto: ^3.0.8
  ditredi: ^2.0.2
  webview_flutter_web: ^0.2.3+4
  mediapipe_genai: ^0.0.1-dev.2
  path_provider: ^2.1.5
  flutter_markdown_plus: ^1.0.5
  http: ^1.6.0
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0

  vector_math: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_riverpod: ^3.4.3
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  local_auth: ^3.0.2
  connectivity_plus: ^7.3.2
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.1.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/docs/
    - assets/docs/images/
    - assets/images/

  fonts:
    - family: PocketGullBrand
      fonts:
        - asset: assets/fonts/PocketGull-Chiseltip.ttf
        - asset: assets/fonts/PocketGull-Chiseltip.ttf
          weight: 700
        - asset: assets/fonts/PocketGull-Chiseltip.ttf
          weight: 900
    - family: PocketGullMono
      fonts:
        - asset: assets/fonts/PocketGullMono-Regular.ttf
        - asset: assets/fonts/PocketGullMono-Bold.ttf
          weight: 700
    - family: PocketGull
      fonts:
        - asset: assets/fonts/PocketGull-Regular.ttf
        - asset: assets/fonts/PocketGull-Bold.ttf
          weight: 700
